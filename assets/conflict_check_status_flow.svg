<svg width="680" height="590" viewBox="0 0 680 590" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Matter status flow for conflict-of-interest check enforcement</title>
<desc>A Matter starts in Draft status. A Conflict Check record is created by an Intake Coordinator, then reviewed by Compliance or a Partner who sets the Result. If Cleared, the Matter can move to Active. If Flagged, the Matter stays locked in Draft status.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="590" fill="#FFFFFF"/>

<line x1="340" y1="84" x2="340" y2="144" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="200" x2="340" y2="260" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="316" x2="210" y2="376" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="316" x2="470" y2="376" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="210" y1="432" x2="210" y2="492" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="470" y1="432" x2="470" y2="492" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="260" y="40" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Matter: Draft</text>

<rect x="220" y="144" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">Conflict Check created</text>
<text x="340" y="186" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">By Intake Coordinator</text>

<rect x="210" y="260" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="274" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">Compliance/Partner reviews</text>
<text x="340" y="302" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Sets the Result field</text>

<rect x="110" y="376" width="200" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="210" y="390" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#173404">Result: Cleared</text>
<text x="210" y="418" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3B6D11">Rule 1 satisfied</text>

<rect x="370" y="376" width="200" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="470" y="390" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#501313">Result: Flagged</text>
<text x="470" y="418" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#A32D2D">Rule 3 applies</text>

<rect x="110" y="492" width="200" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="210" y="514" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#173404">Matter: Active</text>

<rect x="370" y="492" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="470" y="514" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Matter: Draft</text>

<text x="470" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">↻ Rule 3 blocks return to Active</text>
</svg>
